[workspace]
resolver = "3"
members = [
    "crates/rig",
    "crates/dsp",
    "crates/audio",
    "crates/ft8",
    "crates/wspr",
    "crates/decoder",
    "crates/cli",
    "crates/web",
    "crates/conversations",
    "crates/receiver",
    "crates/log",
    "crates/log-sqlite",
    "crates/native",
    "crates/state-logic",
]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
state-logic = { path = "crates/state-logic" }
web-time = "1.1"
futures-util = "0.3"
wsjt-log = { path = "crates/log" }
wsjt-log-sqlite = { path = "crates/log-sqlite" }
time = { version = "0.3", default-features = false, features = ["std"] }
# 0.29 retains WinSQLite support: use the OS library without a bundled C build.
rusqlite = { version = "0.29", default-features = false }
sqlite-system-windows = { package = "libsqlite3-sys", version = "0.26", default-features = false, features = ["winsqlite3"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = "0.16"
wsjt-receiver = { path = "crates/receiver" }
serialport = { version = "4.8", default-features = false }
wsjt-rig = { path = "crates/rig" }
wsjt-rig-native = { package = "wsjt-rig", path = "crates/rig", features = ["native"] }
leptos = { version = "0.8", features = ["csr"] }
gloo-render = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AnalyserNode", "AudioContext", "AudioNode", "AudioContextState",
    "CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData", "MediaDevices",
    "MediaStream", "MediaStreamAudioSourceNode", "MediaStreamConstraints",
    "MediaStreamTrack", "MediaTrackConstraints", "Navigator", "Window", "HtmlDialogElement",
] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
libm = "0.2"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wsjt-dsp = { path = "crates/dsp" }
wsjt-audio = { path = "crates/audio" }
wsjt-ft8 = { path = "crates/ft8" }
wsjt-wspr = { path = "crates/wspr" }
wsjt-rusty = { path = "crates/decoder" }
ft8-conversations = { path = "crates/conversations" }
